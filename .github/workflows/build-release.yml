name: SafeEject Tray Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build tiny .NET Framework 4.8 tray executable
        shell: powershell
        run: |
          msbuild SafeEject/SafeEject.csproj /restore /p:Configuration=Release /p:Platform=AnyCPU

      - name: Verify executable
        shell: powershell
        run: |
          if (!(Test-Path 'SafeEject\bin\Release\net48\SafeEject.exe')) { throw 'SafeEject.exe was not produced.' }
          Get-Item 'SafeEject\bin\Release\net48\SafeEject.exe' | Format-List FullName,Length

      - name: Package
        shell: powershell
        run: |
          Copy-Item 'SafeEject\bin\Release\net48\SafeEject.exe' 'SafeEject-Portable-v1.1.0.exe' -Force
          Compress-Archive -Path 'SafeEject-Portable-v1.1.0.exe' -DestinationPath 'SafeEject-Tray-v1.1.0.zip' -Force

      - name: Create or update v1.1.0 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 SafeEject-Tray-v1.1.0.zip --clobber
          else
            gh release create v1.1.0 SafeEject-Tray-v1.1.0.zip --title 'SafeEject Tray v1.1.0' --notes 'Tiny Windows 7-11 tray utility. Requires .NET Framework 4.8; first run as administrator installs an elevated logon task.'
          fi